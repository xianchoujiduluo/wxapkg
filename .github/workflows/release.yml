name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64 位
          - os: windows-latest
            platform: windows/amd64
            artifact_name: wxapkg-gui-windows-x64
            upload_name: wxapkg-gui-windows-x64.exe
          # macOS Apple Silicon（仅 arm64，不构建 x86_64 / universal）
          - os: macos-latest
            platform: darwin/arm64
            artifact_name: wxapkg-gui-darwin-arm64
            upload_name: wxapkg-gui-darwin-arm64.zip

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 锁定与 go.mod 一致的 wails CLI 版本：@latest 已指向 v2.17.1，其要求 Go >= 1.26，
      # 与本项目 go 1.25 的 go.mod 冲突（GOTOOLCHAIN=local 下直接安装失败）
      - name: Get Wails
        shell: bash
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          echo "wails cli version: $WAILS_VERSION"
          go install "github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION"
          wails version

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          CGO_ENABLED: 0
        run: wails build -platform ${{ matrix.platform }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: mv build/bin/wxapkg-gui.exe build/bin/${{ matrix.upload_name }}

      - name: Build macOS arm64
        if: matrix.os == 'macos-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        run: wails build -platform ${{ matrix.platform }}

      - name: Package .app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          ditto -c -k --keepParent build/bin/wxapkg-gui.app build/bin/${{ matrix.upload_name }}
          rm -rf build/bin/wxapkg-gui.app

      - name: Download UPX
        if: matrix.os == 'windows-latest'
        run: |
          curl -LO https://github.com/upx/upx/releases/download/v4.2.2/upx-4.2.2-win64.zip
          tar -xf upx-4.2.2-win64.zip

      - name: Compress with UPX (Windows only)
        if: matrix.os == 'windows-latest'
        run: .\upx-4.2.2-win64\upx.exe --best --lzma build\bin\${{ matrix.upload_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: build/bin/${{ matrix.upload_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
